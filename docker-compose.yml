services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/market}
    container_name: market-app
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3000'
